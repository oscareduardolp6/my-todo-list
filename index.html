<!doctype html>
<html lang="es-MX" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tareas</title>
    <meta name="theme-color" content="#0f1115" />
    <link rel="icon" href="/icons/favicon-48.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tareas" />
    <script>
      // Evita el destello: aplica el último tema guardado antes del primer pintado.
      // Sin nada guardado se queda en oscuro (el default de la app).
      try {
        var t = localStorage.getItem('todo.theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else if (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
